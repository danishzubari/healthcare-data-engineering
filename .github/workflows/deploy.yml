name: Build and Deploy Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run CMS pipeline
        run: python -m src.ingestion.run_pipeline --max-rows 10000

      - name: Prepare dashboard data
        run: |
          mkdir -p dashboard/data
          cp data/analytics/providers_by_state.csv dashboard/data/providers_by_state.csv
          cp data/analytics/providers_by_specialty.csv dashboard/data/providers_by_specialty.csv
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          raw = pd.read_csv("data/raw/providers.csv")
          processed = raw.drop_duplicates()
          metrics = {
              "records_processed": int(len(processed)),
              "states": int(processed["state"].nunique()),
              "specialties": int(processed["pri_spec"].nunique()),
              "telehealth_records": int(processed["telehlth"].astype(str).str.upper().eq("Y").sum()),
          }
          Path("dashboard/data/summary.json").write_text(json.dumps(metrics, indent=2))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
